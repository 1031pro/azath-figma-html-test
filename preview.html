<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame 2｜PC・スマホ テスト表示</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ebe9;font:14px Meiryo,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd;gap:10px}b{font-size:15px}small{display:block;color:#666;font-size:11px;margin-top:3px}button,a{font:inherit;border:1px solid #ccc;border-radius:6px;padding:8px 15px;background:white;cursor:pointer;color:#222;text-decoration:none}button[aria-pressed=true]{background:#078844;color:white;border-color:#078844}nav{display:flex;gap:8px}iframe{display:block;width:100%;height:calc(100dvh - 84px);border:0;background:white;margin:16px auto 0;box-shadow:0 0 18px #0001;transition:width .2s}iframe.mobile{width:375px;max-width:100%;border-radius:12px 12px 0 0}@media(max-width:650px){header{height:110px;display:block;padding:10px 14px}nav{margin-top:9px}iframe{height:calc(100dvh - 126px)}button,a{padding:5px 12px}}</style></head><body><header><div><b>Frame 2 / テスト表示</b><small>元デザインをもとにスマホ対応。外部リンク・送信は未接続。</small></div><nav><button id="pc" aria-pressed="true">PC</button><button id="mobile" aria-pressed="false">スマホ 375px</button><a href="index.html" target="_blank">ページを開く ↗</a></nav></header><iframe id="screen" src="index.html" title="採用LPの表示確認"></iframe><script>for(const mode of ['pc','mobile'])document.getElementById(mode).onclick=()=>{document.getElementById('screen').className=mode==='mobile'?'mobile':'';for(const key of ['pc','mobile'])document.getElementById(key).setAttribute('aria-pressed',String(key===mode));};</script></body></html>
